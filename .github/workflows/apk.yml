name: Build Android APK

on:
  # 打标签时自动构建并把 APK 挂到 Release
  push:
    tags:
      - 'v*'
  # 也可在 GitHub 网页上手动点 "Run workflow"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备 JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # 新版 Capacitor 要求 Java 21（用 17 会报 invalid source release: 21）
          java-version: '21'

      - name: 安装 Capacitor
        run: npm i @capacitor/cli @capacitor/core @capacitor/android

      - name: 生成离线包
        run: node tools/build-dist.mjs

      - name: 添加 Android 工程
        run: npx cap add android

      - name: 同步网页资源
        run: npx cap copy android

      - name: 构建 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: 重命名 APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/bbc-learning-english-${GITHUB_REF_NAME}.apk"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
