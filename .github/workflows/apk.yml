name: Build Android APK

on:
  # 打标签时自动构建并把 APK 挂到 Release
  push:
    tags:
      - 'v*'
  # 也可在 GitHub 网页上手动点 "Run workflow"
  workflow_dispatch:

# 默认 GITHUB_TOKEN 是只读的，创建 Release 会 403，必须显式要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 的 CLI 要求 Node >= 22
          node-version: '22'

      - name: 准备 JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # 新版 Capacitor 要求 Java 21（用 17 会报 invalid source release: 21）
          java-version: '21'

      - name: 安装 Capacitor 与原生插件
        run: npm i @capacitor/cli @capacitor/core @capacitor/android @capacitor/filesystem esbuild

      # file: 本地插件在部分环境会以符号链接形式进入 node_modules，cap sync 可能漏掉。
      # 这里用真实目录覆盖，确保原生代码被打包进 APK。
      - name: 落实原生插件目录
        run: |
          rm -rf node_modules/httpbridge
          cp -r plugins/httpbridge node_modules/httpbridge

      - name: 生成离线包
        run: node tools/build-dist.mjs

      - name: 添加 Android 工程
        run: npx cap add android

      # BBC 部分老资源仍是 http:// 直链，安卓 9+ 默认拦明文 HTTP，
      # 会出现 "Cleartext HTTP traffic to downloads.bbc.co.uk not permitted"。
      - name: 允许明文 HTTP
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'usesCleartextTraffic' "$MAN"; then
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MAN"
          fi
          grep -n 'usesCleartextTraffic' "$MAN"

      # kotlin-stdlib(1.8.x) 与旧的 kotlin-stdlib-jdk7/jdk8(1.6.x) 类重复，
      # 会导致 :app:checkDebugDuplicateClasses 失败。官方建议排除旧模块。
      - name: 修复 Kotlin 依赖冲突
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

      - name: 同步网页资源并链接原生插件
        run: npx cap sync android

      - name: 构建 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # 便于排查“装不上”：把最终的 minSdk / targetSdk 打进日志
      - name: 打印 SDK 版本
        run: |
          MAN=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*merged*' | head -1)
          echo "merged manifest: $MAN"
          grep -o 'android:minSdkVersion="[0-9]*"\|android:targetSdkVersion="[0-9]*"' "$MAN" || true

      # AGP 在 minSdk>=24 时默认只做 v2 签名，不生成 v1（JAR）签名。
      # 部分国产 ROM 的安装器（MIUI 等）只认 v1，会报
      # “解析软件包时出现问题 (33) / packageInfo is null”。
      # 这里用 apksigner 重签为 v1+v2+v3，兼容性最好。
      - name: 重新签名（v1 + v2 + v3）
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          KS="$HOME/ci-debug.keystore"
          rm -f "$KS"
          keytool -genkeypair -keystore "$KS" -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 >/dev/null 2>&1

          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$BT/zipalign" -p -f 4 "$APK" android/app/build/outputs/apk/debug/aligned.apk
          "$BT/apksigner" sign \
            --ks "$KS" --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out android/app/build/outputs/apk/debug/signed.apk \
            android/app/build/outputs/apk/debug/aligned.apk

          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/debug/signed.apk | head -6
          echo "---- v1 签名文件 ----"
          unzip -l android/app/build/outputs/apk/debug/signed.apk | grep -E 'META-INF/(CERT|ANDROIDD)\.' || echo "警告：没有 v1 签名文件"

      - name: 重命名并生成校验和
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/signed.apk "out/bbc-learning-english-${GITHUB_REF_NAME}.apk"
          cd out
          sha256sum *.apk | tee sha256sum.txt
          ls -l

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            out/*.apk
            out/sha256sum.txt

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/sha256sum.txt
