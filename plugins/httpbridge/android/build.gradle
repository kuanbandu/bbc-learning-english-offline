// 作为被 cap sync 合入到主工程（由 @capacitor/android 生成）的 library 模块，
// 不单独声明 AGP 的 buildscript classpath——沿用主工程的 AGP。
apply plugin: 'com.android.library'

android {
    namespace "com.kuanbandu.httpbridge"
    // 必须与主工程一致：androidx.core 1.17+ 要求 compileSdk >= 36
    compileSdkVersion 36
    defaultConfig {
        minSdkVersion 22
        targetSdkVersion 36
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
}
